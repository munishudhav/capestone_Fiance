<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Pay Global</title>
    <link rel="stylesheet" href="signup page.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="container">
            <nav class="nav">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Features</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="area">
            <div class="container">
                <div class="box">
                    <h1 class="heading">Create Account</h1>
                    <p class="subheading">Join Pay Global and start your journey</p>

                    <form class="form">
                        <div class="email">
                            <label>Email</label>
                            <input type="email" placeholder="Enter your email">
                        </div>

                        <div class="password">
                            <label>Password</label>
                            <input type="password" placeholder="Create a password">
                        </div>

                        <div class="confirm">
                            <label>Confirm Password</label>
                            <input type="password" placeholder="Confirm your password">
                        </div>

                        <div class="options">
                            <label class="remember">
                                <input type="checkbox"> I agree to Terms & Privacy Policy
                            </label>
                        </div>

                        <button class="button full">Create Account</button>
                    </form>

                    <p class="signup">Already have an account? <a href="login page.html">Log in</a></p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-links">
                    <ul>
                        <li><a href="#">Privacy</a></li>
                        <li><a href="#">Terms</a></li>
                        <li><a href="#">Support</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>

</body>
</html>
