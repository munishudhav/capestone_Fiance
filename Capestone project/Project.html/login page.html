<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pay Global</title>
    <link rel="stylesheet" href="login page.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#features">Features</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="area">
            <div class="container">
                <div class="box">
                    <h1 class="heading">Welcome Back</h1>
                    <p class="subheading">Sign in to your Pay Global account</p>
                    <form class="form" aria-label="Login form">
                        <div class="email">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="Enter your email" required aria-required="true">
                        </div>
                        <div class="password">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" placeholder="Enter your password" required aria-required="true">
                        </div>
                        <div class="options">
                            <label class="remember">
                                <input type="checkbox" id="remember" name="remember">
                                Remember me
                            </label>
                            <a href="#forgot" class="forgot-link">Forgot Password?</a>
                        </div>
                        <button type="submit" class="button full" aria-label="Sign in">Sign In</button>
                    </form>
                    <p class="signup">Don't have an account? <a href="#signup">Sign up here</a></p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-links">
                    <ul>
                        <li><a href="#privacy">Privacy</a></li>
                        <li><a href="#terms">Terms</a></li>
                        <li><a href="#support">Support</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
