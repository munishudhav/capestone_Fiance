<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Pay Global</title>
    <link rel="stylesheet" href="login page.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="container">
           
        </div>
    </header>

    <main class="main">
        <section class="area">
            <div class="container">
                <div class="box">
                    <h1 class="heading">Login Account</h1>
                    <p class="subheading">Join Pay Global today</p>

                    <form class="form" aria-label="Signup form">

                        <div class="email">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        </div>

                        <div class="password">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" placeholder="Create a password" required>

                            <div class="show-pass">
                                <input type="checkbox" id="togglePass">
                                <label for="togglePass">Show Password</label>
                            </div>

                        </div>

                        <a href="#" class="forgot-link">Forgot Password?</a>

                        <button type="submit" class="button full">Login</button>
                    </form>

                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-links">
                    <ul>
                        <li><a href="#privacy">Privacy</a></li>
                        <li><a href="#terms">Terms</a></li>
                        <li><a href="#support">Support</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>


</body>
</html>
